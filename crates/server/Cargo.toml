[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tensorloom-core = { path = "../tensorloom-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
open = "5"
